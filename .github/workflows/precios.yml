name: Actualizar precios
on:
  schedule:
    - cron: "0 6 * * *"   # todos los días 06:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/update_prices.py
      - name: Guardar cambios
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add data/products.json
          git diff --cached --quiet || (git commit -m "Actualizar precios" && git push)
